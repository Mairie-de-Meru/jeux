<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Atelier des Lettres</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  :root { --ink:#2b3a67; --pink:#ff5c8a; --sun:#ffc933; --green:#35c27b; --blue:#3b9ae8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; font-family:"Arial Rounded MT Bold","Nunito",ui-rounded,"Helvetica Neue",Arial,sans-serif; color:var(--ink);
    background: linear-gradient(180deg,#bfe6ff 0%,#e7f6ff 55%,#fff1c9 100%); user-select:none; -webkit-user-select:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #fx { pointer-events:none; z-index:30; }
  #ui { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #ui > * { pointer-events:auto; }
  #topbar { position:absolute; top:0; left:0; right:0; height:84px; display:flex; align-items:center; gap:12px; padding:8px 14px; pointer-events:none; }
  #topbar > * { pointer-events:auto; }
  .btn { min-width:64px; min-height:64px; padding:10px 22px; border:0; border-radius:22px; background:#fff; color:var(--ink); font:inherit; font-size:26px;
    box-shadow:0 5px 0 rgba(43,58,103,.25); cursor:pointer; touch-action:manipulation; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(43,58,103,.25); }
  .btn.primary { background:var(--green); color:#fff; }
  .btn.pink { background:var(--pink); color:#fff; }
  .btn.sun { background:var(--sun); }
  .btn.off { opacity:.45; }
  #prompt { flex:1; text-align:center; font-size:clamp(22px,3.4vw,34px); background:rgba(255,255,255,.85); border-radius:22px; padding:10px 18px; min-height:64px; display:flex; align-items:center; justify-content:center; }
  #prompt:empty { visibility:hidden; }
  #dots { position:absolute; top:88px; left:0; right:0; display:flex; justify-content:center; gap:10px; pointer-events:none; }
  .dot { width:20px; height:20px; border-radius:50%; background:#fff; border:3px solid var(--ink); }
  .dot.on { background:var(--sun); }
  .dot.cur { transform:scale(1.25); border-color:var(--pink); }
  #emoji { position:absolute; right:18px; top:100px; font-size:84px; pointer-events:none; }
  #bubble { position:absolute; left:50%; bottom:130px; transform:translateX(-50%); background:#fff; border:4px solid var(--pink); border-radius:26px; padding:12px 26px; font-size:30px; opacity:0; transition:opacity .2s; pointer-events:none; text-align:center; }
  #bubble.show { opacity:1; }
  #bar { position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:center; gap:14px; padding:14px; pointer-events:none; }
  #bar > * { pointer-events:auto; }
  #screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:rgba(231,246,255,.9); padding:20px; text-align:center; overflow:auto; }
  #screen.show { display:flex; }
  #screen.clear { background:transparent; justify-content:flex-start; padding-top:96px; }
  #screen > .col { margin:auto 0; }
  .title-img { max-width:min(92vw,560px); max-height:22vh; object-fit:contain; border-radius:20px; }
  .icon-img { width:72px; height:72px; object-fit:contain; border-radius:16px; }
  .icon-emoji { font-size:56px; line-height:72px; }
  .card h2 { font-size:28px; }
  .levels { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; width:100%; }
  .btn.lvl { flex-direction:column; gap:0; font-size:20px; padding:6px 12px; min-width:104px; }
  .btn.lvl .stars { font-size:18px; }
  #screen .col { display:flex; flex-direction:column; align-items:center; gap:18px; }
  #screen h1 { margin:0; font-size:clamp(34px,6vw,60px); }
  #screen h2 { margin:0; font-size:clamp(26px,4vw,40px); }
  .row { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; align-items:center; }
  .card { background:#fff; border-radius:26px; padding:16px 18px; box-shadow:0 6px 0 rgba(43,58,103,.2); display:flex; flex-direction:column; gap:10px; align-items:center; min-width:220px; }
  .stars { font-size:30px; letter-spacing:2px; }
  .big-stars { font-size:72px; }
  #fps { position:fixed; right:8px; bottom:6px; font:12px monospace; color:#000; background:rgba(255,255,255,.7); padding:2px 6px; z-index:40; display:none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="ui">
  <div id="topbar">
    <button class="btn" id="btn-home" aria-label="Accueil">🏠</button>
    <div id="prompt"></div>
    <button class="btn" id="btn-speak" aria-label="Voix">🔊</button>
  </div>
  <div id="dots"></div>
  <div id="emoji"></div>
  <div id="bubble"></div>
  <div id="bar"></div>
  <div id="screen"></div>
</div>
<div id="fps"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
