<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Horloge Magique</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; color: #2b3a67; user-select: none; -webkit-user-select: none; }
  #app { position: fixed; inset: 0; background: linear-gradient(#7fd3ff, #ffe6a8); }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }
  .hidden { display: none !important; }
  button { font: inherit; border: 0; cursor: pointer; border-radius: 22px; min-height: 72px; min-width: 72px; padding: 10px 26px; font-size: 26px; font-weight: 800; color: #fff; background: #2f7bff; box-shadow: 0 6px 0 rgba(0,0,0,.22); touch-action: manipulation; transition: transform .08s; }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.22); }
  button.green { background: #21b455; }
  button.orange { background: #ff8a2b; }
  button.pink { background: #ff4f8b; }

  #home { background: linear-gradient(#7fd3ff, #ffe6a8 70%, #ffd1e0); justify-content: center; gap: 14px; padding: 12px; overflow: auto; }
  #titreImg { max-height: 34vh; max-width: 90vw; object-fit: contain; border-radius: 26px; }
  #home h1 { margin: 0; font-size: clamp(36px, 8vw, 76px); color: #ff4f8b; text-shadow: 0 4px 0 #fff, 0 8px 12px rgba(0,0,0,.18); text-align: center; }
  #btnPlay { font-size: 40px; padding: 14px 54px; min-height: 92px; border-radius: 30px; }
  #levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; width: min(900px, 94vw); }
  #levels button { display: flex; flex-direction: column; align-items: center; gap: 4px; background: #fff; color: #2b3a67; font-size: 22px; padding: 12px 10px; min-height: 120px; }
  #levels .ico { font-size: 38px; }
  #levels .stars { font-size: 28px; letter-spacing: 2px; }

  #game { justify-content: flex-start; }
  #topbar { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: rgba(255,255,255,.72); backdrop-filter: blur(6px); flex-wrap: wrap; justify-content: center; }
  #card { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 20px; padding: 6px 12px; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
  #cardImg { width: 84px; height: 84px; border-radius: 14px; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; font-size: 52px; }
  #cardLabel { font-size: 22px; font-weight: 800; max-width: 150px; }
  #instruction { flex: 1 1 260px; font-size: clamp(22px, 3.4vw, 34px); font-weight: 800; text-align: center; min-width: 220px; }
  #digital { font-family: "Courier New", ui-monospace, monospace; font-size: clamp(48px, 9vw, 84px); font-weight: 900; background: #1c2540; color: #6dffb0; padding: 2px 22px; border-radius: 18px; box-shadow: inset 0 0 12px #000; }
  #progress { font-size: 30px; letter-spacing: 3px; }
  #stage { flex: 1 1 auto; width: 100%; min-height: 0; position: relative; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #bubble { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: 92%; background: #fff; color: #2b3a67; border: 4px solid #ffc233; border-radius: 26px; padding: 12px 22px; font-size: clamp(22px, 4vw, 32px); font-weight: 800; text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,.2); z-index: 6; pointer-events: none; }
  #bar { width: 100%; display: flex; justify-content: center; align-items: center; gap: 16px; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.72); }
  #btnCheck { min-width: 200px; font-size: 32px; }

  #end { background: rgba(30, 40, 90, .78); justify-content: center; gap: 18px; z-index: 5; text-align: center; padding: 16px; }
  #endTitle { font-size: clamp(32px, 7vw, 60px); color: #fff; margin: 0; font-weight: 900; }
  #endStars { font-size: clamp(60px, 16vw, 130px); letter-spacing: 8px; }
  #endBtns { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; width: 100%; height: 100%; }
  #debug { position: fixed; left: 6px; top: 6px; margin: 0; padding: 6px 8px; background: rgba(0,0,0,.7); color: #9f9; font: 11px/1.3 ui-monospace, monospace; z-index: 30; pointer-events: none; max-width: 60vw; white-space: pre-wrap; }
  @media (max-width: 480px) { #bar { gap: 8px; padding-left: 6px; padding-right: 6px; } #bar button { padding: 10px 14px; font-size: 22px; min-width: 64px; } #btnCheck { min-width: 0; font-size: 24px; } }
  @media (max-height: 520px) { #cardImg { width: 56px; height: 56px; font-size: 36px; } #topbar { padding: 4px 10px; } button { min-height: 64px; } }
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen">
    <img id="titreImg" class="hidden" alt="">
    <h1>Horloge Magique</h1>
    <button id="btnPlay" class="green">▶ Jouer</button>
    <div id="levels"></div>
  </section>

  <section id="game" class="screen hidden">
    <header id="topbar">
      <div id="card"><div id="cardImg"></div><div id="cardLabel"></div></div>
      <div id="instruction"></div>
      <div id="digital" class="hidden"></div>
      <div id="progress"></div>
    </header>
    <main id="stage"><canvas id="c"></canvas><div id="bubble" class="hidden" role="status"></div></main>
    <footer id="bar">
      <button id="btnHome" class="orange" aria-label="Accueil">🏠</button>
      <button id="btnSpeak" aria-label="Lire">🔊 Lire</button>
      <button id="btnCheck" class="green">✓ Vérifier</button>
    </footer>
  </section>

  <section id="end" class="screen hidden">
    <h2 id="endTitle"></h2>
    <div id="endStars"></div>
    <div id="endBtns">
      <button id="btnNext" class="green">Palier suivant ▶</button>
      <button id="btnAgain" class="pink">↻ Rejouer</button>
      <button id="btnEndHome" class="orange">🏠 Accueil</button>
    </div>
  </section>

  <canvas id="confetti"></canvas>
  <pre id="debug" class="hidden"></pre>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
