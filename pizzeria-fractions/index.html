<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pizzeria Fractions</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="bg"></div>
  <canvas id="c"></canvas>

  <svg id="trail" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:7"><polyline id="trail-line" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))"/></svg>
  <div id="ui">
    <div id="hud" class="hidden">
      <button id="btn-home" class="round" aria-label="Accueil">🏠</button>
      <div id="hud-level"></div>
      <div id="hud-dots"></div>
      <div id="hud-stars">⭐ 0</div>
      <button id="btn-speak" class="round" aria-label="Lire à voix haute">🔊</button>
    </div>

    <div id="bubble" class="hidden"></div>
    <div id="hint" class="hidden"></div>
    <div id="equation" class="hidden"></div>
    <div id="reward" class="hidden"></div>
    <div id="anchors"></div>

    <div id="bottom" class="hidden">
      <button id="btn-serve" class="serve hidden" disabled>✓ Servir</button>
      <div id="toppings" class="hidden"></div>
      <div id="knives" class="hidden"></div>
    </div>

    <section id="screen-title" class="screen">
      <img id="logo" class="hidden" alt="">
      <h1>Pizzeria<br>Fractions</h1>
      <div class="deco">🍕 🍰</div>
      <button id="btn-play" class="big green">▶ Jouer</button>
    </section>

    <section id="screen-levels" class="screen hidden">
      <h2>Choisis ton niveau</h2>
      <div id="level-grid"></div>
      <button id="btn-levels-home" class="round" aria-label="Retour">🏠</button>
    </section>

    <section id="screen-end" class="screen end hidden">
      <h2>Bravo !</h2>
      <div id="end-stars"></div>
      <div id="end-total"></div>
      <div class="row">
        <button id="btn-next" class="big green">Niveau suivant ▶</button>
        <button id="btn-replay" class="big blue">↻</button>
        <button id="btn-end-levels" class="big">🏠</button>
      </div>
    </section>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
