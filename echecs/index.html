<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Échecs</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <header id="hud">
    <button id="btn-menu" class="round" aria-label="Menu">☰</button>
    <div id="players" aria-live="polite">
      <div class="pl" id="pl-b"><i class="dot b"></i><span id="nm-b">Robot</span></div>
      <div class="pl" id="pl-w"><i class="dot w"></i><span id="nm-w">Toi</span></div>
    </div>
    <button id="btn-voice" class="round" aria-label="Lire les règles à voix haute">🔊</button>
  </header>
  <div id="msgband"><div id="toast" aria-live="polite"></div></div>
  <main id="stage">
    <canvas id="c"></canvas>
  </main>
  <aside id="panel">
    <div class="actions">
      <button id="btn-undo" class="btn small" disabled>↶ Annuler</button>
      <button id="btn-new" class="btn small ghost">↻ Nouvelle partie</button>
      <button id="btn-moves" class="btn small ghost" aria-expanded="false">Coups ▾</button>
    </div>
    <ol id="history" aria-label="Coups joués"></ol>
  </aside>
</div>

<section id="home" class="overlay">
  <div class="panel">
    <img id="hero" class="hero hidden" alt="" draggable="false">
    <h1>Échecs</h1>
    <div class="group"><h3>Les places</h3>
      <div class="seat" data-seat="1">
        <div class="chips">
          <button class="chip sel" data-v="human">Humain</button>
          <button class="chip" data-v="bot">Robot</button>
        </div>
        <input class="name" maxlength="14" value="Toi" aria-label="Prénom de la place 1" autocomplete="off">
      </div>
      <div class="seat" data-seat="2">
        <div class="chips">
          <button class="chip" data-v="human">Humain</button>
          <button class="chip sel" data-v="bot">Robot</button>
        </div>
        <input class="name" maxlength="14" value="Robot" aria-label="Prénom de la place 2" autocomplete="off">
      </div>
    </div>
    <div class="group"><h3>Ta couleur (place 1)</h3>
      <div class="chips" id="opt-color">
        <button class="chip sel" data-v="w"><b>Blancs</b></button>
        <button class="chip" data-v="b"><b>Noirs</b></button>
        <button class="chip" data-v="random"><b>Hasard</b></button>
      </div>
    </div>
    <div class="group" id="grp-palier"><h3>Palier du robot</h3>
      <div class="chips" id="opt-palier">
        <button class="chip sel" data-v="1"><b>1</b><small>Découverte</small></button>
        <button class="chip" data-v="2"><b>2</b><small>Classique</small></button>
        <button class="chip" data-v="3"><b>3</b><small>Champion</small></button>
      </div>
    </div>
    <div class="group hidden" id="grp-rotate">
      <button class="chip" id="opt-rotate" aria-pressed="false">Tourner le plateau à chaque tour</button>
    </div>
    <div class="row">
      <button id="btn-play" class="btn big">▶ Jouer</button>
      <button id="btn-resume" class="btn big ghost hidden">Reprendre</button>
      <button id="btn-rules" class="round" aria-label="Lire les règles à voix haute">🔊</button>
    </div>
  </div>
</section>

<section id="promo" class="overlay hidden">
  <div class="panel">
    <h2>Promotion : choisis une pièce</h2>
    <div class="promo-grid">
      <button class="pbtn" data-p="Q"><span>♛</span><small>Dame</small></button>
      <button class="pbtn" data-p="R"><span>♜</span><small>Tour</small></button>
      <button class="pbtn" data-p="B"><span>♝</span><small>Fou</small></button>
      <button class="pbtn" data-p="N"><span>♞</span><small>Cavalier</small></button>
    </div>
    <div class="row"><button id="btn-promo-cancel" class="btn ghost">Annuler</button></div>
  </div>
</section>

<section id="end" class="overlay hidden">
  <div class="panel">
    <div class="big-emoji" id="end-emoji">♚</div>
    <h2 id="end-title">Partie terminée</h2>
    <p id="end-sub" class="sub"></p>
    <div class="row">
      <button id="btn-again" class="btn big">↻ Rejouer</button>
      <button id="btn-view" class="btn ghost">Voir le plateau</button>
      <button id="btn-home" class="btn ghost">Menu</button>
    </div>
  </div>
</section>

<script type="module" src="./src/main.js"></script>
</body>
</html>
