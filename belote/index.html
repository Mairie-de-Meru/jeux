<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Belote</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <header id="hud">
    <button id="btn-menu" class="round" aria-label="Menu">☰</button>
    <div id="score" aria-live="polite">
      <div class="team us"><small>Nous</small><b id="sc0">0</b></div>
      <div class="goal" id="goal">/ 501</div>
      <div class="team them"><small>Eux</small><b id="sc1">0</b></div>
    </div>
    <div id="contract" class="hidden"></div>
    <button id="btn-voice" class="round" aria-label="Lire les règles à voix haute">🔊</button>
  </header>
  <main id="stage">
    <canvas id="c"></canvas>
    <div id="bubbles"></div>
    <div id="toast" aria-live="polite"></div>
    <div id="live" class="hidden"></div>
  </main>
  <section id="side">
    <div id="status" aria-live="polite">Bienvenue !</div>
    <div id="advice" class="hidden"></div>
    <div id="bid" class="hidden"></div>
    <div id="hand" aria-label="Tes cartes"></div>
  </section>
</div>

<section id="home" class="overlay">
  <div class="panel">
    <img id="hero" class="hero hidden" alt="" draggable="false">
    <h1>Belote</h1>
    <p class="sub">Toi et ton partenaire contre les deux autres !</p>
    <div class="group" id="grp-palier"><h3>Palier</h3>
      <div class="chips" id="opt-palier">
        <button class="chip sel" data-v="1"><b>1</b><small>Découverte</small></button>
        <button class="chip" data-v="2"><b>2</b><small>Classique</small></button>
        <button class="chip" data-v="3"><b>3</b><small>Champion</small></button>
      </div>
    </div>
    <div class="group" id="grp-places"><h3>Les places</h3>
      <div id="seat-list"></div>
    </div>
    <div class="group" id="grp-diff"><h3>Niveau des robots</h3>
      <div class="chips" id="opt-diff">
        <button class="chip sel" data-v="facile"><b>Facile</b></button>
        <button class="chip" data-v="normal"><b>Normal</b></button>
      </div>
    </div>
    <div class="row">
      <button id="btn-play" class="btn big">▶ Jouer</button>
      <button id="btn-rules" class="round" aria-label="Lire les règles à voix haute">🔊</button>
    </div>
  </div>
</section>

<section id="pass" class="overlay hidden">
  <div class="panel">
    <div class="big-emoji" id="pass-emoji">🧒</div>
    <h2 id="pass-text">Passe l'appareil</h2>
    <div class="row">
      <button id="btn-ready" class="btn big">Je suis prêt</button>
    </div>
  </div>
</section>

<section id="deal" class="overlay hidden">
  <div class="panel">
    <h2 id="deal-title">Bilan</h2>
    <p id="deal-tone" class="sub"></p>
    <table id="deal-table"></table>
    <div class="row">
      <button id="btn-next" class="btn big">Donne suivante ▶</button>
    </div>
  </div>
</section>

<section id="end" class="overlay hidden">
  <div class="panel">
    <div class="big-emoji" id="end-emoji">🎉</div>
    <h2 id="end-title">Bravo !</h2>
    <p id="end-sub" class="sub"></p>
    <div class="row">
      <button id="btn-again" class="btn">↻ Rejouer</button>
      <button id="btn-home" class="btn ghost">Menu</button>
    </div>
  </div>
</section>
<div id="confetti"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
