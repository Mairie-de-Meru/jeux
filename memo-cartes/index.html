<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mémo Cartes</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  :root { --p0: #ff5d73; --p1: #3d9bff; --ink: #3b2a6b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; user-select: none;
    font-family: "Trebuchet MS", "Avenir Next", system-ui, sans-serif; color: var(--ink);
    background: linear-gradient(180deg, #8fd3ff 0%, #c9b8ff 55%, #ffd1e8 100%); }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .layer { position: fixed; inset: 0; display: none; }
  .layer.on { display: flex; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
  .big { min-width: 64px; min-height: 64px; border-radius: 22px; background: #fff; font-size: 26px; font-weight: 800;
    box-shadow: 0 5px 0 rgba(59,42,107,.25); padding: 8px 18px; }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(59,42,107,.25); }
  .big.sel { outline: 5px solid #ffd23f; background: #fffbe0; }
  .big.go { background: #5fd35f; color: #fff; font-size: 34px; min-height: 80px; padding: 8px 44px; }

  #menu { align-items: center; justify-content: center; background-size: cover; background-position: center; }
  #menu .panel { background: rgba(255,255,255,.82); border-radius: 32px; padding: 20px 24px; display: flex; flex-direction: column;
    gap: 14px; align-items: center; max-width: 94vw; max-height: 96vh; overflow: auto; }
  #menu h1 { margin: 0; font-size: clamp(30px, 6vw, 52px); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .theme { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 110px; font-size: 20px; }
  .theme .em { font-size: 52px; line-height: 1.1; }
  .lvl { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 20px; min-width: 84px; }
  .prev { display: grid; gap: 3px; }
  .prev i { width: 14px; height: 14px; border-radius: 4px; background: #8d6bff; display: block; }
  .pl { font-size: 28px; min-width: 120px; }

  #hud { flex-direction: row; justify-content: space-between; align-items: flex-start; padding: 10px; pointer-events: none; gap: 10px; }
  #hud > * { pointer-events: auto; }
  #hud .mid { display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  .pill { background: rgba(255,255,255,.9); border-radius: 999px; padding: 8px 20px; font-weight: 800; font-size: 24px; }
  #scores { display: flex; gap: 10px; }
  .score { border-radius: 999px; padding: 6px 18px; font-weight: 800; font-size: 24px; color: #fff; opacity: .6; transform: scale(.9); transition: .2s; }
  .score.cur { opacity: 1; transform: scale(1.15); outline: 4px solid #fff; }
  #hud .big { font-size: 32px; width: 64px; padding: 0; }

  #end { align-items: center; justify-content: center; background: rgba(59,42,107,.35); }
  #end .panel { background: #fff; border-radius: 32px; padding: 24px 32px; display: flex; flex-direction: column; gap: 14px; align-items: center;
    animation: pop .5s cubic-bezier(.3,1.6,.5,1); max-width: 94vw; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #end .stars { font-size: clamp(48px, 12vw, 84px); letter-spacing: 6px; }
  #end .stars .off { filter: grayscale(1); opacity: .3; }
  #end .win { font-size: 30px; font-weight: 800; }
  #fps { position: fixed; left: 6px; bottom: 6px; background: rgba(0,0,0,.6); color: #fff; font: 12px monospace; padding: 2px 6px; border-radius: 6px; display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="menu" class="layer">
  <div class="panel">
    <h1>Mémo Cartes</h1>
    <div class="row" id="themes"></div>
    <div class="row" id="levels"></div>
    <div class="row" id="players"></div>
    <button class="big go" id="go" aria-label="Jouer">▶ Jouer</button>
  </div>
</div>

<div id="hud" class="layer">
  <button class="big" id="home" aria-label="Menu">🏠</button>
  <div class="mid">
    <div class="pill" id="tries">Essais : 0</div>
    <div id="scores"></div>
  </div>
  <button class="big" id="speak" aria-label="Écouter la consigne">🔊</button>
</div>

<div id="end" class="layer">
  <div class="panel">
    <div class="stars" id="stars"></div>
    <div class="pill" id="endTries"></div>
    <div class="win" id="winner"></div>
    <div class="row">
      <button class="big" id="again">🔁 Rejouer</button>
      <button class="big go" id="next">➡ Suivant</button>
    </div>
  </div>
</div>
<div id="fps"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
